name: CI

# Runs on every pull request and on pushes to main. Uses only free GitHub-hosted runners
# (unlimited for public repositories; within the free minutes for private ones).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build for Cloudflare Workers
        run: npm run build:worker
      - name: Browser bundle contains no secrets or server code
        run: npm run check:bundle -- .open-next/assets
      - name: Migrations match the schema
        run: npx drizzle-kit check
      - name: No high or critical advisories in runtime dependencies
        run: npm audit --omit=dev --audit-level=high
