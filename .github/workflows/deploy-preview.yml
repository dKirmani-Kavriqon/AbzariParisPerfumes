name: Deploy preview

# Builds and deploys to Cloudflare Workers (workers.dev preview).
# Needs the CLOUDFLARE_API_TOKEN repository secret ("Edit Cloudflare Workers" token).
on:
  push:
    branches: ["phase-*", "preview/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check the Cloudflare token is configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - run: npm ci
      - run: npm run deploy:preview
