name: Deploy preview

# Builds the site with OpenNext and deploys it to the workers.dev preview Worker named in
# wrangler.jsonc. Needs the CLOUDFLARE_API_TOKEN repository secret: a Cloudflare API token
# made from the "Edit Cloudflare Workers" template. Worker secrets (DATABASE_URL, ...) are
# set once with `wrangler secret put` and are not needed here. Production deploys are added
# at launch, behind a manual approval.
on:
  push:
    branches: ["phase-*", "preview/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # <worker name from wrangler.jsonc>.<Cloudflare account's workers.dev subdomain>
      PREVIEW_HOST: abzari-paris-preview.abzaric1.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check the Cloudflare token is configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - run: npm ci
      - run: npm run deploy:preview
      - name: Smoke-test the deployed preview
        run: |
          url="https://${PREVIEW_HOST}"
          for path in / /shop /product/rawah /api/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$url$path")
            echo "$path -> $code"; test "$code" = 200
          done
